<!DOCTYPE html>
<html lang="en">
<head>

    <title>Table</title>
</head>
<body>

                <td rowspan="3">5</td>
            </tr> 
            <tr>
                <td>2.</td>
                <td>Ram</td>
            </tr>
            <tr>
                <td>1</td>
                <td>2</td>
                
            </tr>
        </tbody>
    </table>
</body>
</html>
